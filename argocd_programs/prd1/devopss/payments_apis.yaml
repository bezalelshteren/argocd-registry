apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prd1-devopss-devopss-prd-payments_apis
  namespace: blackops-argocd-tenants
  labels:
    blackops/managed: "true"
    blackops/tenant: devopss
spec:
  project: devopss-prd
  source:
    repoURL: https://gitlab.com/exaccccccmple-group/payments-api.git
    targetRevision: master
    path: prd1
    helm:
      releaseName: prd1-prd-devopss-prd-payments_apis
      valueFiles:
        - values.yaml
  destination:
    name: prd1
    namespace: devopss-prd-payments_apis
