apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prd1-customer-alpha-
  namespace: blackops-argocd-tenants
  labels:
    blackops/managed: "true"
    blackops/monitored: "true"
    blackops/tenant: customer-alpha
    blackops/part-of: "argocd"

spec:
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - git:
        repoURL: https://gitlab.example.com/prd2-ayments.git
        revision: master
        directories:
          - path: 'prd/*'

  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        blackops/managed: "true"
        blackops/monitored: "true"
        blackops/tenant: customer-alpha
        blackops/part-of: '{{path.basename}}'

    spec:
      project: customer-alpha-prd
      source:
        repoURL: https://gitlab.example.com/prd2-ayments.git
        targetRevision: master
        path: '{{path}}'
        directory:
          recurse: true

      destination:
        name: prd1
        namespace: '{{namespace}}-*'
