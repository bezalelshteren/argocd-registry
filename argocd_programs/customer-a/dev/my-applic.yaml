apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: customer-a-dev-my-applic
  namespace: argocd

  labels:
    tenant: customer-a
    lifecycle: dev

spec:
  project: customer-a-dev

  source:
    repoURL: https://github.com/example/argocd-config.git
    targetRevision: main
    path: applications/customer-a/my-applic


  destination:
    server: server
    namespace: customer-a-dev-my-applic

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true