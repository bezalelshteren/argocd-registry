apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev1-customer-beta-customer-beta-dev-inventory_service
  namespace: blackops-argocd-tenants
  labels:
    blackops/managed: "true"
    blackops/tenant: customer-beta
spec:
  project: customer-beta-dev
  source:
    repoURL: https://gitlab.example.com/dev3-inventory.git
    targetRevision: master
    path: dev1
    helm:
      releaseName: dev1-dev-customer-beta-dev-inventory_service
      valueFiles:
        - values.yaml
  destination:
    name: dev1
    namespace: customer-beta-dev-inventory_service
