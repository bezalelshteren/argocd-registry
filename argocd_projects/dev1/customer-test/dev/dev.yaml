apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: customer-test-dev
  namespace: blackops-argocd-tenants

spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceBlacklist:
    - group: "*"
      kind: ResourceQuota

  roles:
    - name: admin
      groups:
        - platform-dev
      policies:
        - p, proj:customer-test-dev:admin, applications, *, customer-test-dev/*, allow

  destinations:
    - namespace: customer-test-*
      name: dev1

  sourceRepos:
    - https://gitlab.example.com/dev1.git
