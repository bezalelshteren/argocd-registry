apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: customer-beta-dev
  namespace: blackops-argocd-tenants

spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceBlacklist:
    - group: "*"
      kind: ResourceQuota

  roles:
    - name: admin
      groups:
        - inventory-developers
      policies:
        - p, proj:customer-beta-dev:admin, applications, *, customer-beta-dev/*, allow

  destinations:
    - namespace: customer-beta-*
      name: dev1

  sourceRepos:
    - https://gitlab.example.com/dev3-inventory.git
