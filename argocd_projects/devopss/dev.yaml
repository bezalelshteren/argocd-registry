apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devopss-dev
  namespace: blackops-argocd-tenants
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist:
  - group: '*'
    kind: ResourceQuota
  roles:
  - name: admin
    groups:
    - null
    policies:
    - p, proj:devopss-dev:admin, applications, *, devopss-dev/*, allow
  destinations:
  - namespace: devopss-*
    name: dev1
  sourceRepos:
  - https://gitlab.com/example-group/payments-api.git
  - https://gitlab.com/exccccample-group/payments-api.git
  - https://gitlab.com/exccccame-group/payments-api.git
