apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: custonnmer-test1-prd
  namespace: blackops-argocd-tenants
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist:
    - group: "*"
      kind: ResourceQuota
  roles:
    - groups:
        - group: platform-dev
      name: admin
      policies:
        - p, proj:custonnmer-test1-prd:admin, applications, *, custonnmer-test1-prd/*, allow
        - p, proj:custonnmer-test1-prd:admin, exec, create, get, custonnmer-test1-prd/*, allow
  destinations:
    - namespace: custonnmer-test1-*
      name: 
  sourceRepos:
    - https://github.com/example/orders-service
